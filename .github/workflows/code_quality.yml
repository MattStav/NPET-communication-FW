name: Code Quality

on:
  push:
    branches: [ "master" ]
    paths:
      - "src/**"
      - "CMakeLists.txt"
      - "cmake/**"
      - "vcpkg.json"
      - ".clang-tidy"
      - ".github/workflows/code-quality.yml"
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  clang-tidy:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          cache: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-cli11
            mingw-w64-x86_64-spdlog
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-pip
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-libxslt
            mingw-w64-x86_64-python-lxml
            mingw-w64-x86_64-pybind11
            mingw-w64-x86_64-clang-tools-extra

      - name: Install rang header
        run: |
          curl -L https://raw.githubusercontent.com/agauniyal/rang/master/include/rang.hpp \
            -o /mingw64/include/rang.hpp

      # meas_func.h includes <quadmath.h> for __float128 formatting. g++ finds it via its
      # own built-in search paths, but clang-tidy (running as a Clang frontend in g++
      # compatibility mode) doesn't reliably replicate that, causing a hard
      # "'quadmath.h' file not found" error that corrupts the rest of the TU's analysis.
      # Locate it in this run's actual MSYS2 installation and point clang-tidy at it explicitly,
      # rather than hardcoding a path that could drift with package updates.
      - name: Locate quadmath.h
        id: quadmath
        run: |
          QUADMATH_PATH=$(find /mingw64 -name quadmath.h | head -n1)
          if [ -z "$QUADMATH_PATH" ]; then
            echo "quadmath.h not found under /mingw64" >&2
            exit 1
          fi
          QUADMATH_DIR=$(dirname "$QUADMATH_PATH")
          echo "Found quadmath.h in $QUADMATH_DIR"
          echo "dir=$QUADMATH_DIR" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # clang-tidy only needs to typecheck against real headers, not link a binary,
      # but src/main.cpp, src/cli/helper_func.cpp and src/bindings_to_python.cpp
      # #include the generated MANUAL.md/license/git-tag headers, so those must exist first.
      - name: Generate embedded headers
        run: |
          cmake --build build --target manual_header license_header git_tag_header

      - name: Run clang-tidy
        run: |
          run-clang-tidy \
            -p build \
            -extra-arg=-isystem${{ steps.quadmath.outputs.dir }} \
            -warnings-as-errors='*' \
            '^(?!.*[/\\]_deps[/\\])(?!.*[/\\]icon[/\\]).*[/\\]src[/\\].*'
