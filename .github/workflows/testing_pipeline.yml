name: Testing Pipeline

on:
  push:
    branches: [ "master" ]
    paths:
      - "src/**"
      - "tests/**"
      - "CMakeLists.txt"
      - "cmake/**"
      - "MANUAL.md"
      - "vcpkg.json"
      - ".github/workflows/testing_pipeline.yml"
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [ Release ]
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install com0com (signed build)
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $zipUrl = 'https://downloads.sourceforge.net/project/com0com/com0com/3.0.0.0/com0com-3.0.0.0-i386-and-x64-signed.zip'
            $zipPath = Join-Path $env:TEMP 'com0com-signed.zip'
            $extractPath = Join-Path $env:TEMP 'com0com-signed'

            Write-Host "Downloading $zipUrl"
            Invoke-WebRequest -Uri $zipUrl -OutFile $zipPath -UserAgent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)' -MaximumRedirection 5

            $fileInfo = Get-Item $zipPath
            Write-Host "Downloaded $($fileInfo.Length) bytes to $zipPath"

            $magic = [System.IO.File]::ReadAllBytes($zipPath) | Select-Object -First 2
            if ($magic[0] -ne 0x50 -or $magic[1] -ne 0x4B) {
              Write-Host '--- First 500 bytes of downloaded file (not a valid zip) ---'
              Get-Content -Path $zipPath -TotalCount 500 -Encoding utf8
              throw "Downloaded file is not a valid zip (missing PK signature). Got $($fileInfo.Length) bytes."
            }

            Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force | Out-Null

            $installer = Get-ChildItem -Path $extractPath -Filter 'Setup_com0com_v3.0.0.0_W7_x64_signed.exe' -Recurse | Select-Object -First 1
            if (-not $installer) {
              Write-Host "--- Extracted contents ---"
              Get-ChildItem -Path $extractPath -Recurse | ForEach-Object { Write-Host $_.FullName }
              throw 'Installer exe not found after extraction.'
            }

            Write-Host "Running installer: $($installer.FullName)"
            $proc = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
            Write-Host "Installer exit code: $($proc.ExitCode)"
            if ($proc.ExitCode -ne 0) {
              throw "Installer exited with code $($proc.ExitCode)."
            }
          }
          catch {
            Write-Host '--- FULL ERROR DETAILS ---'
            Write-Host $_.Exception.ToString()
            $_ | Format-List * -Force | Out-String | Write-Host
            throw
          }

      - name: Create com0com virtual COM port pair
        shell: pwsh
        working-directory: 'C:\Program Files (x86)\com0com'
        timeout-minutes: 3
        run: |
          & ".\setupc.exe" install PortName=COM8 PortName=COM9

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          cache: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-cli11
            mingw-w64-x86_64-spdlog
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-pip
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-libxslt
            mingw-w64-x86_64-python-lxml
            mingw-w64-x86_64-pybind11

      - name: Install rang header
        run: |
          curl -L https://raw.githubusercontent.com/agauniyal/rang/master/include/rang.hpp \
            -o /mingw64/include/rang.hpp

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ runner.os }}-msys2-mingw64-${{ matrix.build_type }}

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DENABLE_COVERAGE=ON

      # TODO: Add other targets once available
      # --target NPET_comm_framework_workflow_tests \
      # cant be included because it requires com0com to be installed
      # which is a kernel-mode driver and can't be installed on GitHub Actions runners
      # i.e., requires a self-hosted runner
      - name: Build
        run: |
          cmake --build build \
            --target NPET_comm_FW_framework_tests \
            --target NPET_comm_FW_vm_tests \
            --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --parallel 4

      - name: Install gcovr
        run: |
          python -m pip install --break-system-packages gcovr

      - name: Generate coverage
        run: |
          mkdir -p coverage_html

          gcovr \
            --root . \
            --object-directory build \
            --filter "src/.*" \
            --html-details coverage_html/index.html \
            --print-summary | tee coverage_summary.txt

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: coverage-report
          path: coverage_html
          retention-days: 30

      - name: Generate coverage badge data
        if: success()
        run: |
          mkdir -p badge
          PCT=$(grep -oP 'lines: \K[0-9.]+' coverage_summary.txt)
          COLOR=$(python -c "
          pct = float('$PCT')
          print('brightgreen' if pct >= 90 else 'green' if pct >= 75 else 'yellow' if pct >= 50 else 'red')
          ")
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}' "$PCT" "$COLOR" > badge/coverage-badge.json

      - name: Publish coverage badge
        if: success() && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: badge
          publish_branch: badges
          keep_files: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'